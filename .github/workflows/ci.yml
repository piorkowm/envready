name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: shellcheck
        run: shellcheck envready test/run.sh

      - name: Tests (default bash)
        run: bash test/run.sh

      # macOS ships bash 3.2 at /bin/bash; run the harness and envready on it,
      # because that is the oldest bash envready promises to support.
      - name: Tests (bash 3.2)
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version | head -n 1
          ENVREADY_BASH=/bin/bash /bin/bash test/run.sh
